# pyproject.toml — dependency pins per docs/03 §2 (agent-verified at P0; drift ⇒ ⚠️).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authbc"
version = "0.0.0"
description = "Co-optimizing encoding × authentication placement × signature scheme × batching for FANET telemetry ledgers"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mohamed A. Farouk", email = "mohamed.besco1998@gmail.com" }]

# Runtime deps — pinned per docs/03 §2. cbor2 is pinned EXACTLY (5.8.1 regression, docs/06 §5).
dependencies = [
  "cryptography>=42,<46",   # Ed25519, ECDSA-P256 (docs/06 §4)
  "blspy>=2.0",             # BLS12-381 min-sig, AugScheme (docs/06 §4); py_ecc fallback is ⚠️
  "cbor2==5.8.0",           # DELIBERATE pin (docs/03 §2, docs/06 §5)
  "msgpack>=1.0",
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "pyyaml",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "hypothesis",
  "ruff",
  "mypy",
  "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Vendored NS-3 trees are third-party source and are git-ignored; never lint them. Previously the
# only tree lived under ns-allinone-* and was excluded by accident of its name; the 3.48 migration
# put a tree at ns3/ns-3.48 and ruff started reporting 1172 errors from NS-3 itself (2026-07-29).
extend-exclude = ["ns3/ns-3.*", "ns3/ns-allinone-*"]

[tool.ruff.lint]
# Conservative, high-signal rule set for P0; expanded as real code lands.
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "frozen: frozen-data reproduction gate (slow; re-derives frozen artifacts — `make verify-frozen`)",
]
# Coverage reported now; the ≥90% release gate (docs/03 §4) is enforced from P1 once real
# code exists — stubs alone would make a fail-under threshold meaningless.
addopts = "-q --cov=authbc --cov-report=term-missing"

[tool.mypy]
# Static typing gate (`make typecheck`). Runs clean on src/ with zero suppressions beyond
# the one documented cast in encodings/json_enc.py. Added 2026-07-30 after it found three
# real defects: an LSP violation across the Framer hierarchy, aggregate-only BLS methods
# called through the plain SignatureScheme protocol, and unvalidated config value types.
python_version = "3.12"
files = ["src/authbc"]
ignore_missing_imports = true      # blspy / cbor2 / ns-3 helpers ship no stubs
warn_unused_ignores = true
warn_redundant_casts = true
