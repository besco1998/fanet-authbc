# Pre-commit hooks: ruff lint + mypy (mirror `make lint` and `make typecheck`) — docs/03 §4.
# rev is pinned to a real release and kept current via `pre-commit autoupdate`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        # Mirrors `make typecheck`. Config lives in pyproject [tool.mypy]; the hook's own
        # isolated venv needs the deps that supply the types we actually check against.
        args: [--ignore-missing-imports]
        additional_dependencies: [numpy, types-PyYAML]
        files: ^src/authbc/
