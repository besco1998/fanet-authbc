# E11 — the design ladder (docs/04 §2; review comments 2.3, 2.4, 4.1, 4.3).
# One row per rung per operating point: bytes, verifiability, delay, capacity at both
# thresholds, receiver CPU, energy. Each rung changes ONE thing about the rung before it, in both
# frame formats, so no step of the gain is credited to the wrong cause.
experiment: design-ladder

# [label, Lambda_i rec/s, D_max s]. `adopted` is the TS 22.125-compliant point (B3, 2026-07-30).
operating_points:
  - ["adopted", 50, 0.100]
  - ["relaxed", 20, 0.250]

mtu: 1500
epsilon: 0.05
p_loss: 0.05

# Capacity. `u_saturation` defines N_sat (offered load within the saturation throughput of the
# broadcast model). The V >= 0.95 capacity is READ from the direct ns-3 search, for the one
# traffic source named here: `period` = a send jitter of one sending period, the source that
# follow-up F1b of docs/NMAX_DIRECT_EXPECTATIONS.md designates.
# `u_v95` is the single load ceiling earlier results applied to every configuration (measured at
# N = 50 with a 288 B frame). It is kept ONLY to report its error against the direct values.
u_saturation: 1.000
u_v95: 2.435
n_ceiling: 800
nmax_csv: ns3_nmax_direct.csv
nmax_source: period

# The design rung under the other two schemes: [scheme, signature bytes]. Sizes as measured in
# P1 (BLS is 96 B in the library used, not the 48 B of the minimal-signature variant).
other_schemes:
  - ["ecdsa_p256", 64]
  - ["bls", 96]

# Exhaustive search (the SEARCH_OPTIMUM rows): batch 1..search_max_batch, these intervals.
search_max_batch: 12
ref_candidates: [1, 2, 4, 8, 16]

# Certificate policy of the deployed V2X standard: a full certificate in every fifth message and
# an 8-octet digest in the other four (NDSS 2024; ETSI TS 103 097 HashedId8). Charged per FRAME.
cert_bytes: 162
cert_period: 5
cert_digest_bytes: 8
# The same policy read as a cadence in TIME. The source's "every fifth" is of ten messages a
# second: one full certificate in every 500 ms (NDSS 2024, Sec. II). Per frame, a sender of
# 50 frames/s would send one every 100 ms, which charges the unbatched baseline five times what
# the practice it copies sends (audit F80, open item G30). Both readings are tabulated.
cert_interval_s: 0.5

# Measured on the Raspberry Pi 4 (decision D8) — the same inputs E5 uses.
crypto_csv: p1_crypto.authbc-pi4a.csv
t_hash_ns: 2745.5
p_cpu_w: 0.749
p_radio_w: 0.218
# Encode time per record, authbc-pi4a. ⚠️ Measured for the FIRST format's encoders only; the lean
# codec has not been timed on the Pi, so lean rows report radio energy and leave the total blank.
t_enc_ns: {cbor: 50407, delta: 47759}
