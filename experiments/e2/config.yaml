# E2 — batching cure (T2, docs/04 §2). Placement A vs B × encodings × MTU.
experiment: e2
mtu_values: [256, 576, 1500]
placements: [A, B]
encodings: [json, cbor, msgpack, delta]
g_a: 64          # Ed25519 self-batch (B) / inline per-record (A)
# T2a (docs/02): the batch ceiling is min(MTU, freshness). These make the freshness ceiling
# explicit in E2 so the regime boundary is visible in the frozen data, not just asserted.
lam: 20          # records/s (docs/01 §1 default Lambda)
d_max_s: 0.250   # freshness bound D_max (docs/02 §7)
