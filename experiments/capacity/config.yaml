# (N, Λ) capacity envelope for the 802.11 arm (docs/02 §6a).
# Answers "how many UAVs, at what telemetry rate?" by connecting the NS-3-validated broadcast
# channel model to the co-design. The Λ range spans every real autopilot operating point:
#   1 Hz  ArduPilot default over a 57k SiK radio      5 Hz  PX4 MAVLINK_MODE_NORMAL
#   10 Hz PX4 OSD / USB                               50 Hz PX4 MAVLINK_MODE_ONBOARD (companion)
experiment: capacity
encoding: delta          # the co-design optimum (E5)
g_a: 64                  # Ed25519
h_f: 44  # MEASURED from the implemented wire format (B1, 2026-07-29), not assumed — see docs/01 §2a
mtu: 1500
d_max_s: 0.250           # freshness bound (docs/02 §7) - sets b = min(b_mtu, floor(Λ·D_max))
n_local_values: [5, 10, 20, 35, 50, 75, 100]
lambda_values: [1, 5, 10, 20, 50]

# --- N_max envelope (item B2): report N_local as a CURVE, not an assumed constant.
# Each entry: [label, encoding, placement, Lambda, D_max_s]. The last two rows are the
# 3GPP TS 22.125 R-5.2.2-011 compliant points (<=100 ms) — see docs/02 §7a.
envelope_configs:
  - ["optimized delta/B @250ms",    "delta", "B", 20, 0.250]
  - ["A+CBOR Pillar-1 @250ms",      "cbor",  "A", 20, 0.250]
  - ["A+JSON naive @250ms",         "json",  "A", 20, 0.250]
  - ["optimized delta/B @3GPP100ms/50Hz", "delta", "B", 50, 0.100]
  # Added by audit S3b: these two rows appear in the paper's tab:envelope but were NOT produced
  # by any generator, so they could not be checked and could drift silently. Now derived.
  - ["A+CBOR Pillar-1 @3GPP100ms/50Hz",   "cbor",  "A", 50, 0.100]
  - ["optimized delta/B @3GPP100ms/20Hz", "delta", "B", 20, 0.100]
  - ["optimized delta/B @3GPP100ms/10Hz", "delta", "B", 10, 0.100]
envelope_n_ceiling: 400

# --- U ceilings at which N_max is reported (audit S3b).
# ⚠️ The V>=0.95 column of the paper's tab:envelope used to be hand-computed in LaTeX. It went
# stale when F30 moved the measured crossing 2.797 -> 2.435: the prose was updated to 213/100 but
# the table still said 233/116. Deriving every column from these constants makes that impossible.
#
# The two "strict" entries bracket the PER-REALISATION reading of V (>=95 % of runs must meet it),
# which audit S3b showed differs from the mean reading: at U=2.230 the mean clears 0.95 while
# 10 of 30 seeds fail. The bracket is measured, not assumed -- 1/30 fail at U=1.672, 10/30 at 2.230.
u_ceilings:
  - ["u_lt_1",        1.000]   # saturation throughput; conservative
  - ["v95_mean",      2.435]   # measured crossing, MEAN criterion -- the headline (Mohamed, 2026-08-06)
  - ["v95_strict_lo", 1.672]   # per-realisation criterion, conservative end of the measured bracket
  - ["v95_strict_hi", 2.230]   # per-realisation criterion, optimistic end

